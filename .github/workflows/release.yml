name: Create GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/dnsdist/manifest.json"

permissions:
  contents: write

jobs:
  # A red check must not reach HACS users, so hold the release on the same
  # workflows that guard a pull request.
  tests:
    uses: ./.github/workflows/tests.yml

  ruff:
    uses: ./.github/workflows/ruff.yml

  mypy:
    uses: ./.github/workflows/mypy.yml

  release:
    name: Auto Release on Version Change
    runs-on: ubuntu-latest
    needs: [tests, ruff, mypy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from manifest.json
        id: manifest
        run: |
          version=$(jq -r .version custom_components/dnsdist/manifest.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "no version in manifest.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          tag="v${{ steps.manifest.outputs.version }}"
          # The checkout is shallow and fetches no tags, so ask the remote.
          # Asking the working copy never found one and every push reached
          # the release step, which then rewrote the release it found.
          if git ls-remote --tags --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists. Skipping release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the zip
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          mkdir -p dist
          # The files of the integration at the root of the zip: hacs.json
          # names it, and HACS and the Marketplace extract it into
          # custom_components/dnsdist/
          cd custom_components/dnsdist
          zip -qr ../../dist/dnsdist.zip . \
            -x '*.pyc' '__pycache__/*' '*/__pycache__/*'
          cd ../..
          unzip -l dist/dnsdist.zip

      - name: Create release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.manifest.outputs.version }}
          name: Release v${{ steps.manifest.outputs.version }}
          body_path: README.md
          draft: false
          prerelease: false
          files: dist/dnsdist.zip
