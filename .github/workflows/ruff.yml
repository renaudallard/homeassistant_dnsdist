name: Ruff Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # Callable, so the release gates on this check itself rather than on
  # a copy of its steps that drifts out of step with it.
  workflow_call:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff check
        run: ruff check custom_components/dnsdist/ tests/

      - name: Run ruff format
        run: ruff format --check custom_components/dnsdist/ tests/
