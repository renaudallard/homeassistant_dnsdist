name: Type Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # Callable, so the release gates on this check itself rather than on
  # a copy of its steps that drifts out of step with it.
  workflow_call:

permissions:
  contents: read

jobs:
  mypy:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The pinned Home Assistant refuses to install on anything older.
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy custom_components/dnsdist/ --ignore-missing-imports
